spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASS}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  sql:
    init:
      mode: always
logging:
  level:
    root: INFO
security:
  jwt:
    key:
      private: ${SECURITY_PRIVATE_KEY}
      expiration: ${SECURITY_PRIVATE_KEY_EXP}
    user:
      generator: ${SECURITY_KEY_GENERATOR}